name: CI

on:
  push:
    branches: [main]
  pull_request:

# Ein neuer Push bricht ältere, noch laufende Durchläufe desselben Branches ab.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, Typecheck, Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit- und Komponenten-Tests
        run: npm test -- --ci

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: E2E-Tests (gegen den Web-Build)
        run: npm run test:e2e

      - name: Playwright-Report hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy auf GitHub Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Web-Build mit Unterpfad des Repos
        run: npm run build:web
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}

      - name: Für GitHub Pages vorbereiten
        run: |
          # Expo erzeugt Ordner mit Unterstrich (_expo) – Jekyll würde sie ignorieren.
          touch dist/.nojekyll
          # Single-Page-App: unbekannte Pfade sollen ebenfalls die App laden.
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
